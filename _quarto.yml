    right:
      - href: qna/
        text: "Q&A"
      - text: "About"
        menu:
          - href: about.qmd
            text: "블로그 소개"
          - href: team.qmd
            text: "운영진 소개"
format:
  html:
    theme:
      - cosmo
      - brand
    css: styles.css
    html-math-method: mathjax
    filters:
      - pseudocode
    include-in-header:
      - assets/magazine-header.html
    include-after-body:
      - assets/category-tree.html
      - assets/pseudocode.html
      - assets/post-likes.html
