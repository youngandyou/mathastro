      <g stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
        <path d="m31 54 8-6.5 13-4 12-1.5m52 0 12 1.5 13 4 8 6.5" fill="none" stroke-width="1.35" opacity=".76"/>
        <path d="m60 54 2-12 7-10 9-6 12-2 12 2 9 6 7 10 2 12-2 11-7 10-10 7-11 2-12-2-10-7-6-10Z"
              fill="currentColor" fill-opacity=".07" stroke-width="1.7"/>
        <path d="M70 32q15 10 37-2m-44 12q22 11 51-4M71 76q19 8 36 2" fill="none" opacity=".38" stroke-width=".9"/>
        <path d="m31 54 7 6 17 4.5 18 2.5 17 1 19-1 18-2.5 15-4.5 7-6"
              fill="none" stroke-width="2"/>
        <path d="M31 54q.5 21 66 18 47-1 52-18" fill="none" stroke-width=".8" opacity=".47"/>
      </g>
      <use href="#atlas-beacon" x="31" y="54"/>
      <use href="#atlas-star" x="55" y="64.5"/>
      <use href="#atlas-star" x="90" y="68"/>
      <use href="#atlas-star" x="127" y="64.5"/>
      <use href="#atlas-beacon" x="149" y="54"/>
      <use href="#atlas-star" x="69" y="32"/>
      <use href="#atlas-star" x="90" y="24"/>
      <use href="#atlas-star" x="111" y="32"/>
      <use href="#atlas-star" x="118" y="65"/>
      <use href="#atlas-star" x="90" y="84"/>
      <g fill="currentColor">
        <circle cx="62" cy="42" r="1.5"/><circle cx="62" cy="65" r="1.6"/>
        <circle cx="141" cy="47.5" r="1.5"/><circle cx="39" cy="47.5" r="1.5"/>
      </g>
    </g>
  </symbol>

  <symbol id="physics" viewBox="0 0 180 108">
    <g transform="translate(90 54)">
      <use href="#atlas-orbit" opacity=".94"/>
      <use href="#atlas-orbit" transform="rotate(60)" opacity=".89"/>
      <use href="#atlas-orbit" transform="rotate(-60)" opacity=".89"/>
      <g fill="currentColor">
        <circle cx="47" cy="-7" r="1.6"/><circle cx="-33" cy="13" r="1.5"/>
        <circle cx="27" cy="39" r="1.6"/><circle cx="-12" cy="37" r="1.6"/>
      </g>
      <circle r="12.5" fill="none" stroke="currentColor" stroke-opacity=".38" stroke-dasharray="1.5 3"/>
      <circle r="6.2" fill="currentColor" opacity=".35"/>
      <use href="#atlas-beacon" transform="scale(1.25)"/>
      <use href="#atlas-beacon" x="-52"/>
      <use href="#atlas-star" x="52"/>
      <g transform="rotate(60)">
        <use href="#atlas-star" x="-52"/><use href="#atlas-star" x="52"/>
      </g>
      <g transform="rotate(-60)">
        <use href="#atlas-star" x="-52"/><use href="#atlas-beacon" x="52"/>
      </g>
    </g>
  </symbol>

  <symbol id="computer" viewBox="0 0 180 108">
    <g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
      <path d="M30 45v-8h8m105 0h8v8M30 66v8h8m105 0h8v-8" opacity=".36" stroke-width="1"/>
      <path d="M38 54h102M65 27v55m50-55v55" opacity=".29" stroke-dasharray="1.2 4" stroke-width=".9"/>
