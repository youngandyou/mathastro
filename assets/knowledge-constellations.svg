    <use href="#atlas-star" x="31" y="68"/>
    <use href="#atlas-star" x="56" y="56"/>
    <use href="#atlas-beacon" x="78" y="23"/>
    <use href="#atlas-star" x="83" y="82"/>
    <use href="#atlas-beacon" x="101" y="51"/>
    <use href="#atlas-star" x="126" y="71"/>
    <use href="#atlas-star" x="149" y="58"/>
