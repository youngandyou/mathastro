            stroke-width="2.1"/>
    </g>
    <use href="#atlas-star" x="67" y="30"/>
    <use href="#atlas-beacon" x="40" y="54"/>
    <use href="#atlas-star" x="67" y="78"/>
    <use href="#atlas-star" x="104" y="20"/>
    <use href="#atlas-star" x="90" y="54"/>
    <use href="#atlas-beacon" x="76" y="88"/>
    <use href="#atlas-star" x="113" y="30"/>
    <use href="#atlas-beacon" x="140" y="54"/>
    <use href="#atlas-star" x="113" y="78"/>
    <g fill="currentColor">
      <circle cx="54" cy="42" r="1.65"/><circle cx="54" cy="66" r="1.65"/>
      <circle cx="126" cy="42" r="1.65"/><circle cx="126" cy="66" r="1.65"/>
    </g>
  </symbol>

  <symbol id="generic" viewBox="0 0 180 108">
    <g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
      <path d="M31 68 56 56l22-33 23 28 25 20 23-13M56 56l27 26 18-31M83 82l43-11" stroke-width="1.7"/>
