<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 108">
  <defs>
    <!-- Each symbol inherits its field's colour from the chart. -->
    <g id="atlas-star" fill="currentColor">
      <circle r="5.8" opacity=".09"/>
      <circle r="3.8" opacity=".23"/>
      <circle r="2.2"/>
      <circle r=".9" fill="#fff"/>
    </g>
    <g id="atlas-beacon" fill="currentColor">
      <circle r="10" opacity=".06"/>
      <circle r="6.2" opacity=".14"/>
      <path d="M0-8.5 1.6-1.8 7.3 0 1.6 1.8 0 8.5-1.6 1.8-7.3 0-1.6-1.8Z"/>
      <circle r="1.8" fill="#fff"/>
    </g>
    <g id="atlas-orbit" fill="none" stroke="currentColor" stroke-linejoin="round">
      <path d="M-52 0-47-7-33-13-13-16H13L33-13 47-7 52 0 47 7 33 13 13 16H-13L-33 13-47 7Z" stroke-width="1.3"/>
    </g>
  </defs>

  <symbol id="math" viewBox="0 0 180 108">
    <g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
      <path d="M48 20v64m21-64v64m42-64v64m21-64v64M45 24h90M45 44h90M45 84h90"
            opacity=".18" stroke-width=".8" stroke-dasharray="1 4"/>
      <path d="M32 63h119l-5-3m5 3-5 3M90 93V11l-3 5m3-5 3 5" opacity=".74" stroke-width="1.1"/>
      <path d="M48 60v6m21-6v6m42-6v6m21-6v6M87 24h6m-6 20h6m-6 40h6" opacity=".6"/>
      <path d="m47 19 11 25 11 17 10 11 11 4 11-4 10-11 11-17 11-25"
            stroke-width="2"/>
    </g>
    <g fill="currentColor">
      <circle cx="79" cy="72" r="1.8"/><circle cx="101" cy="72" r="1.8"/>
    </g>
    <use href="#atlas-star" x="47" y="19"/>
    <use href="#atlas-star" x="58" y="44"/>
    <use href="#atlas-star" x="69" y="61"/>
    <use href="#atlas-beacon" x="90" y="76"/>
    <use href="#atlas-star" x="111" y="61"/>
    <use href="#atlas-star" x="122" y="44"/>
    <use href="#atlas-beacon" x="133" y="19"/>
  </symbol>

  <symbol id="astronomy" viewBox="0 0 180 108">
