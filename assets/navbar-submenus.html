<script>
(function() {
  // Editorial labels and an offline fallback. Menu membership comes from counts.
  const navSubmenuData = {
    "abstract algebra": {
      subcategories: [
        { key: "Group Theory", name: "군론 (Group Theory)", count: 31 },
        { key: "Ring Theory", name: "환론 (Ring Theory)", count: 7 },
        { key: "Binary Algebraic Structure", name: "이항대수구조 (Binary Algebraic Structure)", count: 2 },
        { key: "Field Theory", name: "체론 (Field Theory)", count: 1 }
      ]
    },
    "calculus": {
      subcategories: [
        { key: "Vector Calculus", name: "벡터미적분학 (Vector Calculus)", count: 2 }
      ]
    },
    "analysis": {
      subcategories: [
        { key: "Multivariable", name: "다변수해석학 (Multivariable Analysis)", count: 1 }
      ]
    },
    "differential geometry": {
      subcategories: [
        { key: "Curve Theory", name: "곡선론 (Curve Theory)", count: 5 }
      ]
    },
    "graph theory": {
      subcategories: [
        { key: "Graph", name: "그래프 (Graph)", count: 27 },
        { key: "Network Analysis", name: "네트워크 분석 (Network Analysis)", count: 8 },
        { key: "Algorithm", name: "알고리즘 (Algorithm)", count: 3 },
        { key: "Tree", name: "트리 (Tree)", count: 3 }
      ]
    },
    "radio astronomy": {
      subcategories: [
        {
          key: "Radio Software",
          name: "전파 소프트웨어 (Radio Software)",
          count: 3,
          subcategories: [
            { key: "AIPS", name: "AIPS", count: 2 },
            { key: "resolve", name: "resolve", count: 1 }
          ]
        }
      ]
    },
    "general relativity": {
      subcategories: [
        { key: "Equivalence Principle", name: "등가원리 (Equivalence Principle)", count: 1 }
      ]
    }
  };

  function normalizeKey(str) {
    return decodeURIComponent(str || "").trim().toLowerCase();
  }

  function getCategoryKeyFromHref(href) {
    if (!href || href.indexOf("category=") === -1) return "";
    var parts = href.split("category=");
    return normalizeKey(parts[1] ? parts[1].split("&")[0] : "");
  }

  var categoryMenus = new Map();
  var categoryLabels = new Map();
  var categoryOrder = new Map();

  function rememberLabel(key, name) {
    key = normalizeKey(key);
    categoryLabels.set(key, name.replace(/\s*\(\d+\)\s*$/, "").trim());
    if (!categoryOrder.has(key)) categoryOrder.set(key, categoryOrder.size);
  }

  function rememberSubcategories(categories) {
    categories.forEach(function(category) {
      rememberLabel(category.key, category.name);
      rememberSubcategories(category.subcategories || []);
    });
  }

  function captureCategoryMenus() {
    document.querySelectorAll(".navbar-nav > .nav-item.dropdown").forEach(function(item) {
      var menu = item.querySelector(":scope > .dropdown-menu");
      var allLink = menu && menu.querySelector("a.dropdown-item[href*='#category=']");
      if (!allLink) return;
      var key = getCategoryKeyFromHref(allLink.getAttribute("href"));
      categoryMenus.set(key, {
        item: item,
        menu: menu,
        href: allLink.getAttribute("href"),
        allLabel: allLink.textContent.replace(/\s*\(\d+\)\s*$/, "").trim()
      });
      menu.querySelectorAll("a.dropdown-item").forEach(function(link) {
        var key = getCategoryKeyFromHref(link.getAttribute("href"));
        if (key) rememberLabel(key, link.textContent);
      });
    });
    Object.values(navSubmenuData).forEach(function(info) {
      rememberSubcategories(info.subcategories);
    });
    // Keep the existing short link and translated title as a supported alias.
    if (categoryLabels.has("high energy")) {
      categoryLabels.set("high energy astrophysics", categoryLabels.get("high energy"));
      categoryOrder.set("high energy astrophysics", categoryOrder.get("high energy"));
    }
  }

  function buildCategoryTree(counts) {
    var roots = [];
    var nodes = new Map();
    Object.entries(counts).forEach(function(entry) {
      if (!Number.isInteger(entry[1]) || entry[1] <= 0) return;
      var parts = entry[0].split(/\s*(?:>|\/|::)\s*/).filter(Boolean);
      var children = roots;
      parts.forEach(function(label, index) {
        var path = parts.slice(0, index + 1).join(" > ");
        if (!nodes.has(path)) {
          var node = {
            key: path,
            name: categoryLabels.get(normalizeKey(label)) || label,
            count: counts[path] || 0,
            subcategories: []
          };
          nodes.set(path, node);
          children.push(node);
        }
        children = nodes.get(path).subcategories;
      });
    });
    function sortChildren(children) {
      children.sort(function(a, b) {
        var aKey = normalizeKey(a.key.split(" > ").pop());
        var bKey = normalizeKey(b.key.split(" > ").pop());
        return (categoryOrder.get(aKey) ?? Infinity) - (categoryOrder.get(bKey) ?? Infinity)
          || aKey.localeCompare(bKey);
      });
      children.forEach(function(child) { sortChildren(child.subcategories); });
    }
    sortChildren(roots);
    return roots;
  }

  function renderCategoryMenus(counts) {
    if (!categoryMenus.size) return;
    var template = categoryMenus.values().next().value;
    var activeRoots = new Set();
    buildCategoryTree(counts).forEach(function(root) {
      var rootKey = normalizeKey(root.key);
      activeRoots.add(rootKey);
      var entry = categoryMenus.get(rootKey);
      if (!entry) {
        var item = template.item.cloneNode(true);
        var toggle = item.querySelector(":scope > .nav-link");
        var menu = item.querySelector(":scope > .dropdown-menu");
        var id = "nav-category-" + categoryMenus.size;
        toggle.id = id;
        toggle.classList.remove("active", "show");
        toggle.setAttribute("aria-expanded", "false");
        toggle.querySelector(".menu-text").textContent = root.name;
        menu.classList.remove("show");
        menu.setAttribute("aria-labelledby", id);
        template.item.parentElement.insertBefore(item, template.item.parentElement.lastElementChild);
        entry = { item: item, menu: menu, href: template.href, allLabel: root.name + " 전체보기" };
        categoryMenus.set(rootKey, entry);
      }
      entry.item.hidden = false;
      var all = createSubmenuList([{
        key: root.key, name: entry.allLabel, count: root.count
      }], entry.href, 0);
      var children = createSubmenuList(root.subcategories, entry.href, 1);
      entry.menu.replaceChildren(...all.children);
      if (children.children.length) {
        var divider = document.createElement("li");
        var rule = document.createElement("hr");
        rule.className = "dropdown-divider";
        divider.appendChild(rule);
        entry.menu.appendChild(divider);
        entry.menu.append(...children.children);
      }
    });
    categoryMenus.forEach(function(entry, key) {
      entry.item.hidden = !activeRoots.has(key);
    });
    window.dispatchEvent(new CustomEvent("blogCategoryNavigationReady"));
  }

  function formatCountBadges(rootEl) {
    var items = rootEl.querySelectorAll(".dropdown-item .dropdown-text, .dropdown-item");
    items.forEach(function(el) {
      if (el.dataset.badgeProcessed) return;
      if (el.children.length === 0 || (el.classList.contains("dropdown-text") && !el.querySelector(".nav-count-badge"))) {
        var text = el.textContent || "";
        var match = text.match(/^(.*?)(\s*\(\d+\))$/);
        if (match) {
          el.innerHTML = escapeHtml(match[1]) + ' <span class="nav-count-badge">' + escapeHtml(match[2].trim()) + '</span>';
          el.dataset.badgeProcessed = "true";
        }
      }
    });
  }

  function escapeHtml(str) {
    return str
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  function attachSubmenuEvents(li) {
    var timeout = null;
    li.addEventListener("mouseenter", function() {
      if (timeout) {
        clearTimeout(timeout);
        timeout = null;
      }
      // Close sibling submenus
      var siblings = li.parentElement ? li.parentElement.querySelectorAll(".dropdown-submenu") : [];
      siblings.forEach(function(sib) {
        if (sib !== li) sib.classList.remove("is-open");
      });
      li.classList.add("is-open");
    });

    li.addEventListener("mouseleave", function() {
      timeout = setTimeout(function() {
        li.classList.remove("is-open");
      }, 150);
    });
  }

  function createSubmenuList(subcategories, parentHref, level) {
    var ul = document.createElement("ul");
    ul.className = "dropdown-menu dropdown-menu-sub dropdown-menu-level-" + (level || 1);

    var basePath = parentHref ? parentHref.split("#")[0] : "./index.html";

    subcategories.forEach(function(sub) {
      var li = document.createElement("li");
      var href = basePath + "#category=" + encodeURIComponent(sub.key);
      var a = document.createElement("a");
      a.className = "dropdown-item";
      a.href = href;

      var textSpan = document.createElement("span");
      textSpan.className = "dropdown-text";
      textSpan.textContent = sub.name;

      var countSpan = document.createElement("span");
      countSpan.className = "nav-count-badge";
      countSpan.textContent = "(" + sub.count + ")";

      a.appendChild(textSpan);
      a.appendChild(document.createTextNode(" "));
      a.appendChild(countSpan);
      li.appendChild(a);

      if (sub.subcategories && sub.subcategories.length > 0) {
        li.classList.add("dropdown-submenu");
        a.classList.add("has-submenu");
        var childUl = createSubmenuList(sub.subcategories, parentHref, (level || 1) + 1);
        li.appendChild(childUl);
        attachSubmenuEvents(li);
      }

      ul.appendChild(li);
    });

    return ul;
  }

  function applyCategoryCounts(counts) {
    if (!counts) return;

    function getCountFor(key) {
      if (!key) return null;
      var clean = key.trim();
      if (counts[clean] !== undefined) return counts[clean];

      var variations = [
        clean,
        "Math > " + clean,
        "Astronomy > " + clean,
        "Physics > " + clean,
        "Computer > " + clean,
        "Math > Abstract Algebra > " + clean,
        "Math > Differential Geometry > " + clean,
        "Math > Graph Theory > " + clean,
        "Math > Calculus > " + clean,
        "Math > Analysis > " + clean,
        "Astronomy > Radio Astronomy > " + clean,
        "Astronomy > Radio Astronomy > Radio Software > " + clean,
        "Astronomy > General Relativity > " + clean
      ];
      for (var i = 0; i < variations.length; i++) {
        if (counts[variations[i]] !== undefined) return counts[variations[i]];
      }

      var lower = clean.toLowerCase();
      for (var k in counts) {
        var kLower = k.toLowerCase();
        if (kLower === lower || kLower.endsWith(" > " + lower)) {
          return counts[k];
        }
      }
      return null;
    }

    var items = document.querySelectorAll(".navbar-nav .dropdown-item");
    items.forEach(function(item) {
      var href = item.getAttribute("href") || "";
      if (href.indexOf("category=") === -1) return;

      var rawKey = decodeURIComponent(href.split("category=")[1].split("&")[0]).trim();
      var count = getCountFor(rawKey);

      if (count !== null) {
        var badge = item.querySelector(".nav-count-badge");
        if (badge) {
          badge.textContent = "(" + count + ")";
        } else {
          var textSpan = item.querySelector(".dropdown-text") || item;
          var text = textSpan.textContent || "";
          var match = text.match(/^(.*?)(\s*\(\d+\))?$/);
          if (match) {
            textSpan.innerHTML = escapeHtml(match[1].trim()) + ' <span class="nav-count-badge">(' + count + ')</span>';
            textSpan.dataset.badgeProcessed = "true";
          }
        }
      }
    });

    // Update submenu items as well
    var subItems = document.querySelectorAll(".dropdown-menu-sub .dropdown-item");
    subItems.forEach(function(subItem) {
      var href = subItem.getAttribute("href") || "";
      if (href.indexOf("category=") === -1) return;
      var rawKey = decodeURIComponent(href.split("category=")[1].split("&")[0]).trim();
      var count = getCountFor(rawKey);
      if (count !== null) {
        var badge = subItem.querySelector(".nav-count-badge");
        if (badge) {
          badge.textContent = "(" + count + ")";
        }
      }
    });
  }

  function fetchCategoryCounts() {
    if (window.__categoryCounts) {
      renderCategoryMenus(window.__categoryCounts);
      applyCategoryCounts(window.__categoryCounts);
      return;
    }

    // Quarto supplies the path to the site root for every rendered page.
    // Resolve it once, including GitHub Pages' /mathastro/ prefix, instead of
    // probing parent directories and generating a series of 404 responses.
    var offset = document.querySelector('meta[name="quarto:offset"]');
    var siteRoot = new URL(offset ? offset.content : "./", document.baseURI);
    var countsUrl = new URL("assets/category-counts.json", siteRoot);

    fetch(countsUrl)
      .then(function(res) {
        if (!res.ok) throw new Error("HTTP error " + res.status);
        return res.json();
      })
      .then(function(data) {
        if (data && data.counts) {
          window.__categoryCounts = data.counts;
          renderCategoryMenus(data.counts);
          applyCategoryCounts(data.counts);
        }
      })
      .catch(function() {
        // Keep the counts embedded at render time if the resource is offline.
      });
  }

  function setupNavbarSubmenus() {
    var navLinks = document.querySelectorAll(".navbar-nav .dropdown-menu a.dropdown-item");
    if (!navLinks.length) return;

    captureCategoryMenus();

    navLinks.forEach(function(link) {
      var href = link.getAttribute("href") || "";
      var catKey = getCategoryKeyFromHref(href);
      if (!catKey) return;

      var info = navSubmenuData[catKey];
      if (info && info.subcategories && info.subcategories.length > 0) {
        var parentLi = link.closest("li");
        if (parentLi && !parentLi.classList.contains("dropdown-submenu")) {
          parentLi.classList.add("dropdown-submenu");
          link.classList.add("has-submenu");

          var subMenu = createSubmenuList(info.subcategories, href, 1);
          parentLi.appendChild(subMenu);
          attachSubmenuEvents(parentLi);
        }
      }
    });

    // Style any count badges inside the navbar
    var navContainer = document.querySelector(".navbar-nav");
    if (navContainer) {
      formatCountBadges(navContainer);
    }

    // Apply live or fetched counts
    fetchCategoryCounts();

    // Listen for live counts from category-tree on index.qmd
    window.addEventListener("blogCategoryCountsReady", function(e) {
      if (e && e.detail) {
        renderCategoryMenus(e.detail);
        applyCategoryCounts(e.detail);
      }
    });

    // Support touch devices / mobile accordion
    // Handle expansion before Bootstrap's document-level dropdown dismissal.
    (navContainer || document).addEventListener("click", function(e) {
        var toggle = e.target.closest(".navbar-nav .dropdown-submenu > a.has-submenu");
        if (!toggle) return;
        // If on small viewport, tapping submenu toggle can toggle the sub-menu
        if (window.innerWidth < 992) {
          var submenu = toggle.nextElementSibling;
          if (submenu && submenu.classList.contains("dropdown-menu-sub")) {
            // Check if user clicked the right edge (arrow) or want to expand
            var rect = toggle.getBoundingClientRect();
            var clickX = e.clientX - rect.left;
            if (clickX > rect.width - 45) {
              e.preventDefault();
              e.stopPropagation();
              submenu.classList.toggle("show");
              toggle.classList.toggle("sub-expanded");
              toggle.setAttribute("aria-expanded", String(submenu.classList.contains("show")));
            }
          }
        }
    });
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", setupNavbarSubmenus);
  } else {
    setupNavbarSubmenus();
  }
})();
</script>
