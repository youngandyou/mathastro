<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pseudocode@2.4.1/build/pseudocode.min.css">
<script src="https://cdn.jsdelivr.net/npm/pseudocode@2.4.1/build/pseudocode.min.js"></script>
<script>
document.addEventListener("DOMContentLoaded", function () {
  function renderAllPseudocodes() {
    if (typeof pseudocode === "undefined") return;
    document.querySelectorAll(".pseudocode-container").forEach(function (el) {
      if (el.dataset.rendered === "true") return;
      var pre = el.querySelector(".pseudocode");
      if (!pre) return;

      var options = {
        indentSize: el.dataset.indentSize || "1.2em",
        commentDelimiter: " " + (el.dataset.commentDelimiter || "//") + " ",
        lineNumber: el.dataset.lineNumber === "true",
        lineNumberPunc: el.dataset.lineNumberPunc || ":",
        noEnd: el.dataset.noEnd === "true",
        scopeLines: el.dataset.indentLines === "true",
        titlePrefix: el.dataset.captionPrefix || "Algorithm",
      };

      pseudocode.renderElement(pre, options);
      el.dataset.rendered = "true";

      var captionSpan = el.querySelector(".ps-root > .ps-algorithm > .ps-line > .ps-keyword");
      if (captionSpan && el.dataset.pseudocodeNumber) {
        captionSpan.innerHTML = (el.dataset.captionPrefix || "Algorithm") + " " + el.dataset.pseudocodeNumber + " ";
      }
    });
  }

  renderAllPseudocodes();

  if (window.MathJax) {
    if (window.MathJax.startup && window.MathJax.startup.promise) {
      window.MathJax.startup.promise.then(function () {
        if (window.MathJax.typesetPromise) {
          window.MathJax.typesetPromise();
        }
      });
    }
  }
});
</script>
<style>
.ps-root {
  font-family: KaTeX_Main, "Times New Roman", Times, serif;
  font-size: 1.02em;
  font-weight: 400 !important;
  color: var(--bs-body-color, #212529);
}
.ps-root .ps-line {
  font-weight: 400;
  line-height: 1.45;
}
.ps-root .ps-keyword {
  font-weight: 700 !important;
  color: var(--bs-body-color, #111);
}
.ps-root .ps-funcname {
  font-weight: 600 !important;
}
.ps-root .ps-comment {
  font-weight: 400;
  color: var(--bs-secondary-color, #6c757d);
}
.ps-root .ps-linenum {
  font-weight: 400;
  color: var(--bs-secondary-color, #888);
}
.ps-root .ps-algorithm {
  border-top: 2px solid var(--bs-heading-color, #2f6f73);
  border-bottom: 2px solid var(--bs-heading-color, #2f6f73);
  margin: 1.25rem 0;
  padding: 0.5rem 0;
}
.ps-root .ps-algorithm.with-caption > .ps-line:first-child {
  border-bottom: 1.5px solid var(--bs-border-color, #dee2e6);
  padding-bottom: 0.4rem;
  margin-bottom: 0.5rem;
  font-weight: 500;
}
.ps-root .ps-algorithm.with-caption > .ps-line:first-child .ps-keyword {
  font-weight: 700 !important;
}
.pseudocode-container {
  text-align: left;
  margin: 1.5rem 0;
  overflow-x: auto;
}
</style>
